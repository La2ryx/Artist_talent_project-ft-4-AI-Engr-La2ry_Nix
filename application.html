<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Alex Rivera's studio about an original artwork, private commission, or installation." />
    <title>Start an enquiry | Alex Rivera</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-w-[320px] bg-slate-50 font-sans leading-relaxed text-slate-800">
    <header class="bg-slate-950 text-white"><nav class="mx-auto flex max-w-4xl items-center justify-between px-5 py-5 lg:px-8" aria-label="Main navigation"><a class="text-lg font-bold" href="index.html">Alex Rivera<span class="text-amber-400">.</span></a><a class="font-semibold text-amber-300 hover:text-amber-200" href="index.html">← Back to studio</a></nav></header>
    <main class="px-5 py-12 sm:py-20 lg:px-8">
      <div class="mx-auto max-w-3xl">
        <div class="mb-10"><p class="mb-3 text-sm font-bold uppercase tracking-[0.2em] text-amber-700">Studio enquiry</p><h1 class="text-4xl font-black tracking-tight text-slate-950 sm:text-5xl">Let’s start a conversation.</h1><p class="mt-4 max-w-2xl text-lg text-slate-600">Tell us a little about your idea. Alex’s studio will review your enquiry and reply within 3–5 business days.</p></div>
        <form id="application-form" class="space-y-8 rounded-3xl bg-white p-6 shadow-xl shadow-slate-200/60 sm:p-10" novalidate>
          <div id="form-errors" class="hidden rounded-xl border border-red-300 bg-red-50 p-4 text-red-800" role="alert" tabindex="-1"></div>
          <fieldset class="space-y-5"><legend class="mb-1 text-xl font-bold text-slate-950">Your details</legend><div class="grid gap-5 sm:grid-cols-2"><label class="block"><span class="font-semibold">Full name <span class="text-red-700">*</span></span><input id="full_name" name="full_name" autocomplete="name" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200" type="text" /><span class="field-error mt-1 block text-sm text-red-700" data-error-for="full_name"></span></label><label class="block"><span class="font-semibold">Email address <span class="text-red-700">*</span></span><input id="email" name="email" autocomplete="email" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200" type="email" /><span class="field-error mt-1 block text-sm text-red-700" data-error-for="email"></span></label></div><label class="block"><span class="font-semibold">Phone number</span><input id="phone" name="phone" autocomplete="tel" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200" type="tel" /><span class="field-error mt-1 block text-sm text-red-700" data-error-for="phone"></span></label></fieldset>
          <fieldset class="space-y-5 border-t border-slate-200 pt-8"><legend class="mb-1 text-xl font-bold text-slate-950">Your project</legend><label class="block"><span class="font-semibold">What can the studio help with? <span class="text-red-700">*</span></span><select id="project_type" name="project_type" required class="mt-2 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200"><option value="">Select one</option><option value="original-artwork">Original artwork</option><option value="private-commission">Private commission</option><option value="installation">Digital or physical installation</option><option value="exhibition">Exhibition or partnership</option></select><span class="field-error mt-1 block text-sm text-red-700" data-error-for="project_type"></span></label><div class="grid gap-5 sm:grid-cols-2"><label class="block"><span class="font-semibold">Estimated budget (USD) <span class="text-red-700">*</span></span><select id="budget" name="budget" required class="mt-2 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200"><option value="">Select a range</option><option value="under-2500">Under $2,500</option><option value="2500-5000">$2,500–$5,000</option><option value="5000-10000">$5,000–$10,000</option><option value="over-10000">$10,000+</option></select><span class="field-error mt-1 block text-sm text-red-700" data-error-for="budget"></span></label><label class="block"><span class="font-semibold">Ideal completion date</span><input id="completion_date" name="completion_date" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200" type="date" /><span class="field-error mt-1 block text-sm text-red-700" data-error-for="completion_date"></span></label></div><label class="block"><span class="font-semibold">Tell us about your idea <span class="text-red-700">*</span></span><textarea id="project_details" name="project_details" required minlength="20" rows="5" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200"></textarea><span class="field-error mt-1 block text-sm text-red-700" data-error-for="project_details"></span></label></fieldset>
          <div class="border-t border-slate-200 pt-8"><label class="flex items-start gap-3"><input id="consent" name="consent" required class="mt-1 h-5 w-5 accent-amber-500" type="checkbox" /><span class="text-sm text-slate-600">I agree that Alex Rivera’s studio may use these details to respond to my enquiry. <span class="text-red-700">*</span></span></label><span class="field-error mt-1 block text-sm text-red-700" data-error-for="consent"></span><button class="mt-7 w-full rounded-full bg-slate-950 px-6 py-4 font-bold text-white transition hover:bg-slate-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-500 sm:w-auto" type="submit">Send enquiry</button><p id="form-success" class="mt-4 hidden rounded-xl bg-green-50 p-4 font-semibold text-green-800" role="status"></p></div>
        </form>
      </div>
    </main>
    <script src="validation.js" defer></script>
  </body>
</html>
