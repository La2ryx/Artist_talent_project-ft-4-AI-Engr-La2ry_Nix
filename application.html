<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Contact Alex Rivera's studio about an original artwork, private commission, or installation." />
    <meta name="theme-color" content="#0f172a" />
    <title>Start an enquiry | Alex Rivera</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="application-page">
    <a class="skip-link" href="#application-main">Skip to enquiry form</a>
    <header class="site-header">
        <nav class="site-nav" aria-label="Main navigation">
            <a class="brand" href="index.html">Alex Rivera<span>.</span></a>
            <a class="back-link" href="index.html">← Back to studio</a>
        </nav>
    </header>

    <main id="application-main" class="application-main" tabindex="-1">
        <div class="application-content">
            <header class="application-intro">
                <p class="eyebrow">Studio enquiry</p>
                <h1>Let’s start a conversation.</h1>
                <p>Share a little about your idea, and the studio will be in touch.</p>
            </header>

            <form id="application-form" class="application-form" novalidate>
                <div id="form-errors" class="form-errors" role="alert" tabindex="-1" hidden></div>

                <fieldset class="form-fieldset">
                    <legend>Your details</legend>
                    <div class="form-grid">
                        <label class="form-field" for="full_name">
                            <span>Full name <span class="required-mark" aria-hidden="true">*</span></span>
                            <input id="full_name" name="full_name" autocomplete="name" type="text" required
                                aria-describedby="error-full_name" />
                            <span id="error-full_name" class="field-error" data-error-for="full_name"></span>
                        </label>
                        <label class="form-field" for="email">
                            <span>Email address <span class="required-mark" aria-hidden="true">*</span></span>
                            <input id="email" name="email" autocomplete="email" type="email" required
                                aria-describedby="error-email" />
                            <span id="error-email" class="field-error" data-error-for="email"></span>
                        </label>
                    </div>
                    <label class="form-field" for="phone">
                        <span>Phone number <span class="optional-mark">(optional)</span></span>
                        <input id="phone" name="phone" autocomplete="tel" type="tel" aria-describedby="error-phone" />
                        <span id="error-phone" class="field-error" data-error-for="phone"></span>
                    </label>
                </fieldset>

                <fieldset class="form-fieldset">
                    <legend>Your project</legend>
                    <label class="form-field" for="project_type">
                        <span>What can the studio help with? <span class="required-mark"
                                aria-hidden="true">*</span></span>
                        <select id="project_type" name="project_type" required aria-describedby="error-project_type">
                            <option value="">Select one</option>
                            <option value="original-artwork">Original artwork</option>
                            <option value="private-commission">Private commission</option>
                            <option value="installation">Installation</option>
                            <option value="exhibition">Exhibition or partnership</option>
                        </select>
                        <span id="error-project_type" class="field-error" data-error-for="project_type"></span>
                    </label>
                    <div class="form-grid">
                        <label class="form-field" for="budget">
                            <span>Estimated budget (USD) <span class="required-mark" aria-hidden="true">*</span></span>
                            <select id="budget" name="budget" required aria-describedby="error-budget">
                                <option value="">Select a range</option>
                                <option value="under-2500">Under $2,500</option>
                                <option value="2500-5000">$2,500–$5,000</option>
                                <option value="5000-10000">$5,000–$10,000</option>
                                <option value="over-10000">$10,000+</option>
                            </select>
                            <span id="error-budget" class="field-error" data-error-for="budget"></span>
                        </label>
                        <label class="form-field" for="completion_date">
                            <span>Ideal completion date <span class="optional-mark">(optional)</span></span>
                            <input id="completion_date" name="completion_date" type="date"
                                aria-describedby="error-completion_date" />
                            <span id="error-completion_date" class="field-error"
                                data-error-for="completion_date"></span>
                        </label>
                    </div>
                    <label class="form-field" for="project_details">
                        <span>Tell us about your idea <span class="required-mark" aria-hidden="true">*</span></span>
                        <textarea id="project_details" name="project_details" rows="6" minlength="20" required
                            aria-describedby="details-hint error-project_details"></textarea>
                        <span id="details-hint" class="field-hint">Please include at least 20 characters.</span>
                        <span id="error-project_details" class="field-error" data-error-for="project_details"></span>
                    </label>
                </fieldset>

                <div class="form-submit">
                    <label class="consent-field" for="consent">
                        <input id="consent" name="consent" type="checkbox" required aria-describedby="error-consent" />
                        <span>I agree that Alex Rivera’s studio may use these details to respond to my enquiry.
                            <span class="required-mark" aria-hidden="true">*</span></span>
                    </label>
                    <span id="error-consent" class="field-error" data-error-for="consent"></span>
                    <button class="button button-dark" type="submit">Send enquiry</button>
                    <p id="form-success" class="form-success" role="status" tabindex="-1" hidden></p>
                </div>
            </form>
        </div>
    </main>

    <script src="validation.js" defer></script>
</body>

</html>
