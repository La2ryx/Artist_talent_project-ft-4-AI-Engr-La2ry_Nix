<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentHub Admin Console</title>
    <script>
        try {
            const savedTheme = localStorage.getItem("agenthub-theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (savedTheme === "dark" || (!savedTheme && prefersDark)) document.documentElement.classList.add("dark");
            else document.documentElement.classList.remove("dark");
        } catch {
            if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
            else document.documentElement.classList.remove("dark");
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <link rel="stylesheet" href="styles/custom-styles.css">
</head>
<body>
    <header>
        <p>AgentHub Admin Console</p>
    </header>
    <main id="main" aria-busy="true">
        <h1>Loading AgentHub Admin Console</h1>
        <p role="status" aria-live="polite">The administration workspace is loading. Please wait.</p>
        <noscript>
            <p>This console requires JavaScript to run. Enable JavaScript and reload the page.</p>
        </noscript>
    </main>
    <script src="app.js"></script>
</body>
</html>
